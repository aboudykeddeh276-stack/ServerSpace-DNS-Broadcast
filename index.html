<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Parked - K-Systems Edge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full text-center">
        <!-- Minimalist SquareSpace style placeholder -->
        <div class="w-16 h-16 border border-[#285f57] rounded flex items-center justify-center mx-auto mb-8 shadow-[0_0_15px_rgba(23,63,58,0.3)]">
            <svg class="w-8 h-8 text-[#a8ddc1]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
            </svg>
        </div>
        
        <h1 class="text-3xl font-light tracking-wide text-white mb-4" id="domain-name">Domain Connected</h1>
        <p class="text-slate-400 mb-8 text-sm">This domain is securely anchored to the Keddeh Systems Edge Carrier. The backend runtime is standing by for initialization.</p>
        
        <div class="flex flex-col space-y-3">
            <button onclick="window.location.href='hcf_workstation.html'" class="w-full px-6 py-3 bg-[#173f3a] text-white hover:bg-[#285f57] transition-all rounded text-sm tracking-wider uppercase">
                Boot Virtual Substrate
            </button>
            <button onclick="window.location.href='https://braink.keddeh.com'" class="w-full px-6 py-3 border border-[#1f2937] text-slate-300 hover:bg-[#1f2937] hover:text-white transition-all rounded text-sm tracking-wider uppercase">
                Manage Domain Settings
            </button>
        </div>
    </div>

    <script>
        // Dynamically display the hosted domain name
        document.getElementById('domain-name').textContent = window.location.hostname || "Domain Connected";
    </script>
</body>
</html>
